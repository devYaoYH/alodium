# redash — an app fragment, merged into the node stack by the root
# docker-compose.yml `include:` list. This file owns everything redash:
# service(s), the networks it joins, the volumes it keeps. Secrets arrive
# BY NAME from secrets/redash.env (the include's env_file) — values are
# minted host-side (scripts/mint-secrets.sh on deploy); no agent ever reads
# them. Shared networks re-declare the root's attributes exactly; compose
# merges.
#
# Source: upstream getredash/redash, vendored as a RELEASED image
# (redash/redash:10.1.0.b50633 — the current stable tag on
# hub.docker.com/r/redash/redash, Oct 2025). No source mirror needed: the
# app ships official images. The redash + redis images are pinned by TAG
# here (not digest) because the jail has no docker/registry egress to
# resolve a digest; the operator runs `./scripts/pin-images.sh --pull`
# before deploy to pin them (the designed flow — that script rewrites every
# `image: <tag>` to `image: <tag>@sha256:…`). The postgres digest is reused
# from the rest of the node (same `postgres:16-alpine`, already vetted).
#
# Auth: Redash has NO native OIDC (SAML + Google + LDAP + REMOTE_USER only),
# and Pocket ID speaks OIDC, not SAML — so the door is the oauth2-proxy
# authshim (docs/SSO.md pattern 3): a Pocket ID passkey at the door, and
# Redash trusts the forwarded identity via REDASH_REMOTE_USER_LOGIN (header
# X-Auth-Request-Email, copied by the Caddy (authed) snippet) — one passkey
# opens it. Pocket ID is the ONLY login: password login is off, and the
# first-run /setup screen never appears because redash-init creates the org
# with the operator's Pocket ID email as its (passwordless) admin.

# Backend env shared by init, scheduler and worker (the server adds its
# web/auth settings on top of the same values).
x-redash-backend-env: &redash-backend-env
  PYTHONUNBUFFERED: "0"
  REDASH_LOG_LEVEL: "INFO"
  REDASH_REDIS_URL: "redis://redash-redis:6379/0"
  REDASH_DATABASE_URL: "postgresql://redash:${REDASH_DB_PASSWORD:-}@redash-db:5432/redash"
  REDASH_COOKIE_SECRET: "${REDASH_COOKIE_SECRET:-}"
  REDASH_SECRET_KEY: "${REDASH_SECRET_KEY:-}"
  # The periodic version check phones home to version.redash.io — which
  # `dash` (internal) can't reach — and errors until the first-run setup
  # creates an org. Off.
  REDASH_VERSION_CHECK: "false"

services:
  # --- apps ring 1: dashboards ------------------------------------------------
  # Redash web server (port 5000), reached through Caddy at dash.<domain>.
  # The authshim copies the verified Pocket ID email into
  # X-Auth-Request-Email; REDASH_REMOTE_USER_HEADER trusts it, so a passkey
  # session is logged in without a second form. Enable:
  #   docker compose --profile apps up -d redash-server redash-scheduler redash-worker
  redash-server:
    profiles: [apps]
    image: redash/redash:10.1.0.b50633
    platform: linux/amd64
    container_name: redash-server
    restart: unless-stopped
    command: server
    depends_on:
      redash-init:
        condition: service_completed_successfully
      redash-redis:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: "0"
      REDASH_LOG_LEVEL: "INFO"
      REDASH_REDIS_URL: "redis://redash-redis:6379/0"
      REDASH_DATABASE_URL: "postgresql://redash:${REDASH_DB_PASSWORD:-}@redash-db:5432/redash"
      REDASH_COOKIE_SECRET: "${REDASH_COOKIE_SECRET:-}"
      REDASH_SECRET_KEY: "${REDASH_SECRET_KEY:-}"
      REDASH_WEB_WORKERS: "4"
      # Public base URL Redash advertises (invite links, redirects).
      REDASH_BASEURL: "https://dash.${NODE_DOMAIN}/"
      # TLS terminates at Caddy; do not let Flask-Talisman HSTS-upgrade the
      # internal hop (it would loop between Caddy and the app).
      REDASH_ENFORCE_HTTPS: "false"
      # SSO via the authshim: a verified Pocket ID passkey sets
      # X-Auth-Request-Email (copied by the (authed) snippet), which Redash
      # trusts at /remote_user/login (route.caddy sends /login there).
      # Pocket ID is the only login — no Redash passwords exist (redash-init
      # makes the admin passwordless). Break-glass is the CLI, e.g.
      #   docker compose exec redash-server ./manage.py users grant_admin <email>
      REDASH_REMOTE_USER_LOGIN_ENABLED: "true"
      REDASH_REMOTE_USER_HEADER: "X-Auth-Request-Email"
      REDASH_PASSWORD_LOGIN_ENABLED: "false"
    networks: [front, dash]

  # Schema + org bootstrap and migrations, one-shot. Redash never creates its
  # own tables (the server 500s on a fresh volume), and with no organization
  # every page redirects to the /setup screen to invent a local admin. So:
  # create_tables (no-op once tables exist), `db upgrade` (migrations a new
  # tag brings), then — only while NO org exists — create_root the operator's
  # Pocket ID email as a passwordless admin (--google = no password; it
  # only matters that the email matches what the authshim forwards). Other
  # Pocket ID users land in the default group on first login. Safe (and
  # wanted) on every `up`; everything below waits for it to exit 0.
  redash-init:
    profiles: [apps]
    image: redash/redash:10.1.0.b50633
    platform: linux/amd64
    container_name: redash-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /app/manage.py database create_tables
        /app/manage.py db upgrade
        if /app/manage.py org list | grep -q '^Slug:'; then
          echo "redash-init: org exists, nothing to bootstrap"
        elif [ -z "$$REDASH_ADMIN_EMAIL" ]; then
          echo "redash-init: no org and RADICALE_OPERATOR_EMAIL unset — set it in .env (your Pocket ID email) and re-up" >&2
          exit 1
        else
          /app/manage.py users create_root "$$REDASH_ADMIN_EMAIL" "$$REDASH_ADMIN_EMAIL" --google --org default
        fi
    depends_on:
      - redash-db
    environment:
      <<: *redash-backend-env
      # The operator's Pocket ID email (root .env; the variable predates a
      # node-wide name — .env.example: "the operator's Pocket ID email").
      REDASH_ADMIN_EMAIL: "${RADICALE_OPERATOR_EMAIL:-}"
    networks: [dash]

  # RQ scheduler: only ENQUEUES periodic + scheduled-query jobs. It executes
  # nothing — that is redash-worker's job.
  redash-scheduler:
    profiles: [apps]
    image: redash/redash:10.1.0.b50633
    platform: linux/amd64
    container_name: redash-scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      redash-init:
        condition: service_completed_successfully
      redash-redis:
        condition: service_started
    environment: *redash-backend-env
    networks: [dash]

  # RQ worker: executes ad-hoc + scheduled queries, schema refreshes, emails
  # and periodic housekeeping. QUEUES unset = every default queue (Redash's
  # `default_queues`), which is right for a single node; split into per-queue
  # workers only if ad-hoc queries start starving behind scheduled ones.
  redash-worker:
    profiles: [apps]
    image: redash/redash:10.1.0.b50633
    platform: linux/amd64
    container_name: redash-worker
    restart: unless-stopped
    command: worker
    depends_on:
      redash-init:
        condition: service_completed_successfully
      redash-redis:
        condition: service_started
    environment:
      <<: *redash-backend-env
      WORKERS_COUNT: "2"
    networks: [dash]

  # Redash metadata DB. Private `dash` network — one client set
  # (server + worker), like miniflux's `feeds`. Digest reused from the node.
  redash-db:
    profiles: [apps]
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    container_name: redash-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: redash
      POSTGRES_USER: redash
      POSTGRES_PASSWORD: ${REDASH_DB_PASSWORD:-}
    volumes:
      - redash_db:/var/lib/postgresql/data
    networks: [dash]

  # Query-result queue + job bus. Ephemeral — not backed up; Redash
  # persists query definitions in postgres, not redis.
  redash-redis:
    profiles: [apps]
    image: redis:7-alpine
    container_name: redash-redis
    restart: unless-stopped
    networks: [dash]

networks:
  front:
    internal: true
  dash:
    # Redash <-> its metadata DB + job bus. One client set, one network,
    # like miniflux's `feeds`. No egress, no docker socket.
    internal: true

volumes:
  redash_db:
