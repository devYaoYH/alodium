# The SUT repository allowlist. A node-config PR controls Compose and its
# manifests, but it may not make the host controller clone an arbitrary private
# Forgejo repository into its test VM. Images built from a mirror are read from
# the candidate's manifest/*.toml [build] blocks (image, ref, args, patch), the
# same source deploy.sh's build-mirrored.sh uses; only the repository must be
# listed here. Add one in the same reviewed PR that introduces the [build].

[[repo]]
repo = "apps/search-broker"

[[repo]]
repo = "mirrors/calino"
