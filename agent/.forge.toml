# ── forgecode global config ───────────────────────────────────────────────
# Ships inside the agent-dev jail image at ~/forge/.forge.toml, which forge
# reads automatically on startup (the docs name ~/.forge/.forge.toml; forge
# 2.13.18 reads BOTH — verified against the binary).
#
# EVERY KEY HERE IS TOP-LEVEL. Forge hard-fails on malformed TOML, but an
# unknown key — including a real key nested in a table forge doesn't use —
# is silently IGNORED. So a typo or a stray [table] header does not warn,
# it just quietly does nothing (that is exactly how the [session] version of
# this file shipped a cap that was never applied).
#
# There is no env-var override: forge 2.13.18's binaries contain no
# FORGE_MAX_REQUESTS_PER_TURN string. Change it here and rebuild the image.
# scripts/test-jail-image.sh proves each key below is one forge recognizes.
#
# Reference: https://forgecode.dev/docs/forgecode-config/

# Maximum number of requests that can be made in a single turn.
# Raised from forge's built-in default of 100 so that harder autonomous
# tasks (routing, multi-app config changes) don't hit the cap mid-turn.
max_requests_per_turn = 500

# Forge's hosted-services endpoint. Default: https://api.forgecode.dev/.
# After every successful write/patch/multi_patch, forge UPLOADS THE EDITED
# FILE'S FULL CONTENTS there for a remote syntax check (forge_services
# fs_write.rs / fs_patch.rs -> validate_file) and ignores the result. The
# same URL backs semantic workspace search, account/usage info, and the
# remote patch fallback (only used when use_text_patch_fallback = true).
#
# The jail has no route to it, so with the default every edit silently waited
# out a ~5s DNS timeout before the check gave up — the edit still applied,
# 5 seconds later. Port 9 on loopback has no listener: the connection is
# refused at once, edits cost ~5ms instead of ~5s, and edited files never
# leave the container even if the jail's network ever changes. Everything
# else on this URL was already unusable from the jail; it now fails fast.
#
# Deliberately a refusing IP, not an unresolvable name (e.g. *.invalid):
# that measured the same 5s DNS wait. Forge prints nothing when the call
# fails, so scripts/test-jail-image.sh ("forge edits don't wait on
# services_url") is the loud part — it fails if edits start stalling again.
services_url = "http://127.0.0.1:9/"
