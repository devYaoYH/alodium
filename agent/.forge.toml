# ── forgecode autonomous-mode session limits ─────────────────────────────
# This file ships inside the agent-dev jail image at ForgeCode's default
# config location (~/forge/.forge.toml).  ForgeCode reads it automatically
# on startup — no symlinks needed.  Environment variables
# (FORGE_SESSION__*) override these values at runtime.
#
# References:
#   https://forgecode.dev/docs/forgecode-config/

[session]
# Maximum number of requests that can be made in a single turn.
# Raised from forge's built-in default of 100 so that harder autonomous
# tasks (routing, multi-app config changes) don't hit the cap mid-turn.
max_requests_per_turn = 500