# ── forgecode autonomous-mode session limits ─────────────────────────────
# This file ships inside the agent-dev jail image.  The entrypoint
# symlinks it into the workspace so forge picks it up (and excludes it
# from git).  Environment variables (FORGE_SESSION__*) override these
# values at runtime — the file is the image default, not a hard lock.
#
# References:
#   https://forgecode.dev/docs/configuration/overview
#   https://forgecode.dev/docs/configuration/session

[session]
# Maximum number of requests that can be made in a single turn.
# Raised from forge's built-in default of 100 so that harder autonomous
# tasks (routing, multi-app config changes) don't hit the cap mid-turn.
max_requests_per_turn = 500